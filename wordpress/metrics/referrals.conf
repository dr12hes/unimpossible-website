# Anonymous source counters: never log IPs, cookies, user agents or full referrer URLs.
map $http_referer $unimp_source {
 default "";
 ~*^https?://(www\.)?chatgpt\.com([/:?#]|$) chatgpt;
 ~*^https?://chat\.openai\.com([/:?#]|$) chatgpt;
 ~*^https?://(www\.)?claude\.ai([/:?#]|$) claude;
 ~*^https?://(www\.)?perplexity\.ai([/:?#]|$) perplexity;
 ~*^https?://copilot\.microsoft\.com([/:?#]|$) copilot;
 ~*^https?://gemini\.google\.com([/:?#]|$) gemini;
 ~*^https?://(www\.)?google\.(com|co\.uk)([/:?#]|$) google;
 ~*^https?://(www\.)?bing\.com([/:?#]|$) bing;
 ~*^https?://(www\.)?duckduckgo\.com([/:?#]|$) duckduckgo;
}
map $http_user_agent $unimp_bot {
 default 0;
 ~*(bot|crawler|spider|slurp|headless|curl|wget|python|httpx) 1;
}
map $http_user_agent $unimp_test {
 default false;
 "UNimpossible-Metrics-Check" true;
}
map "$request_method:$status:$uri:$unimp_bot:$unimp_source" $unimp_count {
 default 0;
 ~^GET:200:(/|/privacy):0:.+ 1;
}
log_format unimp_referrals escape=json '{"at":"$time_iso8601","page":"$uri","source":"$unimp_source","test":$unimp_test}';
