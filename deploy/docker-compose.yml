services:
  web:
    image: nginx:alpine
    container_name: unimpossible-website
    restart: always
    volumes:
      - ./live:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.unimpossible-http.rule=Host(`unimpossible.co.uk`) || Host(`www.unimpossible.co.uk`)
      - traefik.http.routers.unimpossible-http.entrypoints=web
      - traefik.http.routers.unimpossible-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.services.unimpossible-http.loadbalancer.server.port=80
      - traefik.http.routers.unimpossible-web.rule=Host(`unimpossible.co.uk`) || Host(`www.unimpossible.co.uk`)
      - traefik.http.routers.unimpossible-web.entrypoints=websecure
      - traefik.http.routers.unimpossible-web.tls.certresolver=letsencrypt
      - traefik.http.routers.unimpossible-web.service=unimpossible-http
    networks:
      - traefik-public

  # The website read and audit (scanner/). Same hostnames, /api/ prefix, so the page calls it same-origin.
  scanner:
    build: ./scanner
    image: unimpossible-scanner:latest
    container_name: unimpossible-scanner
    restart: always
    env_file: .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.unimpossible-api.rule=(Host(`unimpossible.co.uk`) || Host(`www.unimpossible.co.uk`)) && PathPrefix(`/api/`)
      - traefik.http.routers.unimpossible-api.entrypoints=websecure
      - traefik.http.routers.unimpossible-api.tls.certresolver=letsencrypt
      - traefik.http.routers.unimpossible-api.priority=1000
      - traefik.http.routers.unimpossible-api.service=unimpossible-api
      - traefik.http.services.unimpossible-api.loadbalancer.server.port=8000
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
