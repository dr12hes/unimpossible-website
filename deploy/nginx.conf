server {
    listen 80;
    server_name unimpossible.co.uk www.unimpossible.co.uk;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;   # TLS ends at Traefik; a relative Location keeps /privacy/ -> /privacy on https

    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Clean URLs. HTML is never cached; assets are.
    location = /          { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location = /privacy   { try_files /privacy.html =404; add_header Cache-Control "no-cache"; }
    location = /privacy/  { return 301 /privacy; }
    location ~* \.(css|js)$       { expires 7d;  add_header Cache-Control "public"; }
    location ~* \.(png|svg|ico)$  { expires 30d; add_header Cache-Control "public"; }
    location = /sitemap.xml { }
    location = /robots.txt  { }

    # Old single-page site had no other routes; anything unknown goes home.
    location / { try_files $uri $uri.html /index.html; }

    # Never serve the deploy kit if someone mounts the repo root by mistake.
    location ~ ^/(deploy|\.git)(/|$) { return 404; }
}
