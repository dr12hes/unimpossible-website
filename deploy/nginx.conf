# Public HTTPS and /api scanner routing remain managed by existing Traefik.
server {
 listen 80;
 server_name www.unimpossible.co.uk;
 return 301 https://unimpossible.co.uk$request_uri;
}
server {
 listen 80;
 server_name unimpossible.co.uk;
 client_max_body_size 20m;
 location / {
  proxy_pass https://159.69.106.3;
  proxy_set_header Host unimpossible.co.uk;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_ssl_server_name on;
  proxy_ssl_name staging.unimpossible.co.uk;
  proxy_ssl_verify on;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  proxy_ssl_verify_depth 3;
  proxy_connect_timeout 10s;
  proxy_read_timeout 60s;
 }
}
